name: Agentplace lead endpoint tests
on:
  pull_request:
    paths:
      - 'functions/api/agent-lead.js'
      - 'tests/agent-lead.test.mjs'
      - '.github/workflows/agent-lead-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test tests/agent-lead.test.mjs
